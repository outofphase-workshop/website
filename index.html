<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Out of Phase Guitar Workshop</title>
<link rel="stylesheet" href="style-shared.css">
<link rel="stylesheet" href="style-home.css">

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
<link rel="shortcut icon" href="favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">
</head>
  
<body class="splash-body">

<!-- Mobile Sticky Header (ADDED THIS HERE) -->
<header class="mobile-header">
  <button class="menu-toggle-btn" id="menuToggleBtn">Menu</button>
</header>

<!-- Desktop Navigation (Hidden <= 700px) -->
<header class="splash-nav desktop-only-nav">
  <a href="about.html">About</a>
  <a href="services.html">Services</a>
  <a href="gallery.html">Gallery</a>
  <a href="contact.html">Contact</a>
</header>

<!-- Mobile Overlay Drawer (Contains Nav + Footer links) -->
<div class="mobile-drawer" id="mobileDrawer">
  
  <header class="drawer-header">
    <button class="drawer-close-btn" id="drawerCloseBtn">Close</button>
  </header>

  <div class="drawer-content">
    <nav class="drawer-nav">
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="drawer-footer-links">
      <a href="terms.html">Terms &amp; Conditions</a>
      <a href="privacy-policy.html">Privacy Policy</a>
    </div>
  </div>

  <div class="drawer-logo-wrap">
    <a href="index.html">
      <img src="images/nav-icon.svg" alt="Out of Phase" class="splash-footer-icon">
    </a>
  </div>
</div>

<main class="splash-hero">
  <img src="images/oop_logo.svg" alt="Out of Phase Guitar Workshop" class="splash-logo">
</main>

<!-- Mobile Sticky Centered Logo -->
<div class="mobile-footer-logo">
  <a href="index.html">
    <img src="images/nav-icon.svg" alt="Out of Phase" class="splash-footer-icon">
  </a>
</div>

<!-- Desktop Footer (Hidden <= 700px) -->
<footer class="splash-footer desktop-only-footer">
  <a href="terms.html" class="splash-footer-left">Terms &amp; Conditions</a>
  <a href="index.html">
    <img src="images/nav-icon.svg" alt="Out of Phase" class="splash-footer-icon">
  </a>
  <a href="privacy-policy.html" class="splash-footer-right">Privacy Policy</a>
</footer>

<script>
  // Mobile Drawer Toggle Script
  document.addEventListener('DOMContentLoaded', () => {
    const menuBtn = document.getElementById('menuToggleBtn');
    const closeBtn = document.getElementById('drawerCloseBtn');
    const drawer = document.getElementById('mobileDrawer');

    if (menuBtn && drawer && closeBtn) {
      menuBtn.addEventListener('click', () => {
        drawer.classList.add('is-open');
        document.body.style.overflow = 'hidden'; // Freeze background scrolling
      });

      closeBtn.addEventListener('click', () => {
        drawer.classList.remove('is-open');
        document.body.style.overflow = '';
      });
    }
  });
</script>

</body>
</html>
